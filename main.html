<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="flex-box">
		<input id="block_id" placeholder="Enter block id"/>
		<input id="colour_id" placeholder="Enter colour Hexcode" />
		<button id="change_button">Change</button>
		<button id="reset_button">Reset</button>
	</div>
	
	<div class="grid-container">
		<script>
			const container = document.currentScript.parentElement;
			for (let i = 0; i < 100; i++) {
				const cell = document.createElement("div");
				cell.id = i.toString();
				cell.className = "grid-item valid";
				container.appendChild(cell);
			}
		</script>
	</div>

	<div id="result"></div>
	<div>Flags left: <span id="flagsLeft">10</span></div>

	<script type="text/javascript" src="./script.js"></script>
</body>

</html>
